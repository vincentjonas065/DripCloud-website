    <body>
        <section class="enquiry-form-section">

            <h2>Product & Size Inquiries</h2>

            <p>Submit a pre-order request or check size availability for upcoming drops.</p>

            <!-- FIXED FORM -->
           <form action="thankyou.html" method="get">

                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="product">Product Interested In:</label><br>
                <select id="product" name="product">
                    <option value="hoodie">cotton_tshirt_flatlay</option>
                    <option value="tee">grey_tracksuit_lookbook</option>
                    <option value="cap">husstle_in_silence</option>
                    <option value="hoodie"> purple</option>
                    <option value="tee"> custom graphic graphics.</option>

                </select><br><br>

                <label for="message">Enquiry Details:</label><br>
                <textarea id="message" name="message" rows="5" required></textarea><br><br>

                <button type="submit">Submit Enquiry</button>

            </form>

        </section>
    </body>
