<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Enquiry | DRIP CLOUD</title>
    <meta name="description" content="Ask DRIP CLOUD about product sizes, availability, pre-orders or sponsorship. Submit an enquiry to receive an estimated response.">
    <meta name="keywords" content="DRIP CLOUD enquiry, streetwear product availability, clothing size enquiry, pre-order streetwear, sponsorship enquiry">

    <!-- Website logo -->
    <link rel="icon" type="image/png" href="../image/background/logo2.jpg">

    <!-- External stylesheet -->
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <!-- Header and navigation -->
    <header>

        <h1>DRIP CLOUD</h1>

        <p>Float Above the Rest</p>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="./about.html">About Us</a></li>
                <li><a href="./products.html">Products</a></li>
                <li><a href="./enquiry.html" aria-current="page">Enquiry</a></li>
                <li><a href="./contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>


    <!-- Main enquiry content -->
    <main>

        <section class="enquiry-section" aria-labelledby="enquiry-heading">

            <h2 id="enquiry-heading">Product &amp; Size Enquiry</h2>

            <p>
                Submit a pre-order request, check size availability, or
                enquire about sponsorship and volunteer opportunities.
            </p>


            <!-- Enquiry form -->
            <form id="enquiry-form" action="mailto:support@dripcloud.co.za" method="post" enctype="text/plain" novalidate>

                <!-- Full Name -->
                <label for="fullname">Full Name:</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    minlength="2" maxlength="80"
                    autocomplete="name"
                    required
                >
                <span class="error-message" id="fullname-error" aria-live="polite"></span>


                <!-- Email -->
                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="254"
                    autocomplete="email"
                    required
                >
                <span class="error-message" id="email-error" aria-live="polite"></span>


                <!-- Enquiry type -->
                <label for="enquiry-type">Enquiry Type:</label>
                <select
                    id="enquiry-type"
                    name="enquiry-type"
                    required
                >
                    <option value="">-- Select an Enquiry Type --</option>
                    <option value="availability">Size Availability</option>
                    <option value="pre-order">Pre-Order</option>
                    <option value="sponsorship">Sponsorship</option>
                    <option value="volunteer">Volunteer</option>
                </select>
                <span class="error-message" id="enquiry-type-error" aria-live="polite"></span>


                <!-- Product -->
                <label for="product">Product Interested In:</label>
                <select
                    id="product"
                    name="product"
                    required
                >
                    <option value="">-- Select a Product --</option>
                    <option value="drip-cloud-collection" data-price="0">DRIP CLOUD Collection</option>
                    <option value="cotton-tshirt" data-price="250">Cotton T-Shirt</option>
                    <option value="grey-tracksuit" data-price="650">Grey Tracksuit</option>
                    <option value="hustle-in-silence" data-price="300">Hustle in Silence</option>
                    <option value="black-streetwear" data-price="400">Black Streetwear</option>
                    <option value="red-black-graphic-tee" data-price="280">Red &amp; Black Graphic Tee</option>
                    <option value="white-red-tee" data-price="280">White &amp; Red Tee</option>
                    <option value="white-yellow-collection" data-price="350">White &amp; Yellow Collection</option>
                    <option value="yellow-lightning-hoodie" data-price="520">Yellow Lightning Hoodie</option>
                </select>
                <span class="error-message" id="product-error" aria-live="polite"></span>


                <!-- Size -->
                <label for="size">Preferred Size:</label>
                <select
                    id="size"
                    name="size"
                    required
                >
                    <option value="">-- Select a Size --</option>
                    <option value="small">Small (S)</option>
                    <option value="medium">Medium (M)</option>
                    <option value="large">Large (L)</option>
                    <option value="extra-large">Extra Large (XL)</option>
                </select>
                <span class="error-message" id="size-error" aria-live="polite"></span>


                <!-- Quantity -->
                <label for="quantity">Quantity:</label>
                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    max="20"
                    step="1"
                    value="1"
                    required
                >
                <span class="error-message" id="quantity-error" aria-live="polite"></span>


                <!-- Enquiry details -->
                <label for="message">Enquiry Details:</label>
                <textarea
                    id="message"
                    name="message"
                    minlength="10" maxlength="1000"
                    rows="5"
                    placeholder="Enter your enquiry here..."
                    required
                ></textarea>
                <span class="error-message" id="message-error" aria-live="polite"></span>


                <!-- Submit button -->
                <button type="submit">Submit Enquiry</button>

            </form>


            <!-- Processed response shown on the page after submission -->
            <section id="enquiry-result" class="enquiry-result" aria-live="polite" hidden>
                <h3>Your Enquiry Summary</h3>
                <p id="result-summary"></p>
                <p id="result-total"></p>
                <p id="result-stock"></p>
            </section>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>&copy; 2026 DRIP CLOUD. All rights reserved.</p>

    </footer>


    <!-- Validation and processed response -->
    <script>
        const form = document.getElementById("enquiry-form");
        const resultBox = document.getElementById("enquiry-result");

        const fields = {
            fullname: {
                input: document.getElementById("fullname"),
                error: document.getElementById("fullname-error"),
                message: "Enter a name between 2 and 80 characters."
            },
            email: {
                input: document.getElementById("email"),
                error: document.getElementById("email-error"),
                message: "Enter a valid email address (up to 254 characters)."
            },
            "enquiry-type": {
                input: document.getElementById("enquiry-type"),
                error: document.getElementById("enquiry-type-error"),
                message: "Please select an enquiry type."
            },
            product: {
                input: document.getElementById("product"),
                error: document.getElementById("product-error"),
                message: "Please select a product."
            },
            size: {
                input: document.getElementById("size"),
                error: document.getElementById("size-error"),
                message: "Please select a size."
            },
            quantity: {
                input: document.getElementById("quantity"),
                error: document.getElementById("quantity-error"),
                message: "Please enter a quantity between 1 and 20."
            },
            message: {
                input: document.getElementById("message"),
                error: document.getElementById("message-error"),
                message: "Enter enquiry details between 10 and 1000 characters."
            }
        };

        function isValidEmail(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        function validateField(key) {
            const field = fields[key];
            const value = field.input.value.trim();
            let valid = value !== "";

            if (valid && key === "fullname") {
                valid = value.length >= 2 && value.length <= 80;
            }

            if (valid && key === "email") {
                valid = value.length <= 254 && isValidEmail(value);
            }

            if (valid && key === "message") {
                valid = value.length >= 10 && value.length <= 1000;
            }

            if (valid && key === "quantity") {
                const qty = Number(value);
                valid = Number.isInteger(qty) && qty >= 1 && qty <= 20;
            }

            field.error.textContent = valid ? "" : field.message;
            field.input.setAttribute("aria-invalid", String(!valid));
            return valid;
        }

        // Validate each field when the user leaves it
        Object.keys(fields).forEach(function (key) {
            fields[key].input.addEventListener("blur", function () {
                validateField(key);
            });
        });

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            let allValid = true;
            let firstInvalid = null;

            Object.keys(fields).forEach(function (key) {
                if (!validateField(key)) {
                    allValid = false;
                    if (!firstInvalid) {
                        firstInvalid = fields[key].input;
                    }
                }
            });

            if (!allValid) {
                resultBox.hidden = true;
                firstInvalid.focus();
                return;
            }

            // Process the enquiry
            const productSelect = fields.product.input;
            const selectedOption = productSelect.options[productSelect.selectedIndex];
            const productName = selectedOption.text;
            const unitPrice = Number(selectedOption.dataset.price);
            const quantity = Number(fields.quantity.input.value);
            const sizeText = fields.size.input.options[fields.size.input.selectedIndex].text;
            const typeText = fields["enquiry-type"].input.options[fields["enquiry-type"].input.selectedIndex].text;
            const name = fields.fullname.input.value.trim();

            const total = unitPrice * quantity;
            const formattedTotal = "R " + total.toLocaleString("en-ZA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            // Stock is shown as an estimate. Replace with live stock data if available.
            const stockText = (fields["enquiry-type"].input.value === "sponsorship" || fields["enquiry-type"].input.value === "volunteer")
                ? "Our team will review your request and respond by email."
                : "Availability for size " + sizeText + " will be confirmed by our team by email.";

            document.getElementById("result-summary").textContent =
                "Thank you, " + name + ". Your " + typeText.toLowerCase() +
                " request for " + quantity + " x " + productName + " (" + sizeText + ") is ready to send. Send the email draft to complete your request.";

            if (unitPrice > 0) {
                document.getElementById("result-total").textContent =
                    "Estimated total: " + formattedTotal + " (" + quantity + " x R " + unitPrice.toFixed(2) + ")";
            } else {
                document.getElementById("result-total").textContent =
                    "Pricing for this collection is confirmed on request.";
            }

            document.getElementById("result-stock").textContent = stockText;

            const emailSubject = "DRIP CLOUD Product Enquiry: " + typeText;
            const emailBody = [
                "Name: " + name,
                "Email: " + fields.email.input.value.trim(),
                "Enquiry type: " + typeText,
                "Product: " + productName,
                "Size: " + sizeText,
                "Quantity: " + quantity,
                document.getElementById("result-total").textContent,
                "",
                "Enquiry details:",
                fields.message.input.value.trim()
            ].join("\n");
            const emailUrl = "mailto:support@dripcloud.co.za?subject=" +
                encodeURIComponent(emailSubject) + "&body=" + encodeURIComponent(emailBody);
            resultBox.hidden = false;
            resultBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
            form.reset();
            window.location.href = emailUrl;
        });
    </script>

</body>

</html>
