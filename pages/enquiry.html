<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry | DRIP CLOUD</title>

    <link rel="icon" type="image/png" href="../image/background/orange.png">
</head>

<body>

    <!-- Header and navigation -->
  <header>

    <h1>DRIP CLOUD</h1>

    <p>Float Above the Rest</p>

    <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="./about.html">About Us</a></li>
            <li><a href="./products.html">Products</a></li>
            <li><a href="./enquiry.html">Enquiry</a></li>
            <li><a href="./contact.html">Contact Us</a></li>
        </ul>
    </nav>

</header>


    <!-- Enquiry form -->
    <main>

        <section>

            <h2>Product &amp; Size Enquiry</h2>

            <p>
                Submit a pre-order request or enquire about product and size availability.
            </p>


            <form action="./thankyou.html" method="get">

                <!-- Full Name -->
                <label for="fullname">Full Name:</label>
                <br>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    required
                >

                <br><br>


                <!-- Email -->
                <label for="email">Email Address:</label>
                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <br><br>


                <!-- Product -->
                <label for="product">Product Interested In:</label>
                <br>

                <select id="product" name="product" required>

                    <option value="">-- Select a Product --</option>

                    <option value="drip-cloud-collection">
                        DRIP CLOUD Collection
                    </option>

                    <option value="cotton-tshirt">
                        Cotton T-Shirt
                    </option>

                    <option value="grey-tracksuit">
                        Grey Tracksuit
                    </option>

                    <option value="hustle-in-silence">
                        Hustle in Silence
                    </option>

                    <option value="black-streetwear">
                        Black Streetwear
                    </option>

                    <option value="red-black-graphic-tee">
                        Red &amp; Black Graphic Tee
                    </option>

                    <option value="white-red-tee">
                        White &amp; Red Tee
                    </option>

                    <option value="white-yellow-collection">
                        White &amp; Yellow Collection
                    </option>

                    <option value="yellow-lightning-hoodie">
                        Yellow Lightning Hoodie
                    </option>

                </select>

                <br><br>


                <!-- Size -->
                <label for="size">Preferred Size:</label>
                <br>

                <select id="size" name="size" required>

                    <option value="">-- Select a Size --</option>

                    <option value="small">Small (S)</option>
                    <option value="medium">Medium (M)</option>
                    <option value="large">Large (L)</option>
                    <option value="extra-large">Extra Large (XL)</option>

                </select>

                <br><br>


                <!-- Enquiry Details -->
                <label for="message">Enquiry Details:</label>
                <br>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    cols="40"
                    placeholder="Enter your enquiry here..."
                    required
                ></textarea>

                <br><br>


                <!-- Submit -->
                <button type="submit">
                    Submit Enquiry
                </button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>&copy; 2026 DRIP CLOUD. All rights reserved.</p>

    </footer>

</body>

</html>
