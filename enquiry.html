<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRIP CLOUD | Product Enquiry</title>
      <link rel="icon" type="image/png" href="./image/background/orange_enquirie_LOGO.png">
</head>
<body style="background-color: rgb(255, 192, 0);">
    <header>
        <h1>
                <img src="./image/background/orange_enquirie_LOGO.png" alt="DRIP CLOUD Logo" style="width: 50px; height: 50px; vertical-align: middle; margin-right: 5px;">
                DRIP CLOUD
            </h1>
            <p>Float Above the Rest</p>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="enquiry-form-section">
            <h2>Product & Size Inquiries</h2>
            <p>Submit a pre-order request or check size availability for upcoming drops.</p>

            <form action="#" method="post">
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="product">Product Interested In:</label><br>
                <select id="product" name="product">
                    <option value="hoodie">DRIP Oversized Hoodie</option>
                    <option value="tee">Melting Cloud Graphic Tee</option>
                    <option value="cap">DRIP Headwear Cap</option>
                </select><br><br>

                <label for="message">Enquiry Details:</label><br>
                <textarea id="message" name="message" rows="5" required></textarea><br><br>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 DRIP CLOUD. All rights reserved.</p>
    </footer>
</body>
</html>
